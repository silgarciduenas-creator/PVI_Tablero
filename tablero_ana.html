<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVI — Revisión Ana</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1117;--s1:#161920;--s2:#1E2028;--s3:#262830;
  --line:#2A2D35;--ink:#E8EAF0;--ink2:#8B909E;--ink3:#4A4F5E;
  --red:#F05252;--r2:rgba(240,82,82,.12);
  --amber:#F59E0B;--a2:rgba(245,158,11,.12);
  --green:#10B981;--g2:rgba(16,185,129,.1);
  --blue:#3B82F6;--b2:rgba(59,130,246,.1);
  --r:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}

/* PIN */
#pin-screen{
  position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.pin-logo{font-family:'IBM Plex Mono',monospace;font-size:1rem;color:var(--ink3);letter-spacing:.2em;text-transform:uppercase;margin-bottom:.3rem;}
.pin-title{font-size:1.6rem;font-weight:500;color:var(--ink);margin-bottom:.2rem;}
.pin-sub{font-size:.65rem;color:var(--ink3);letter-spacing:.15em;text-transform:uppercase;margin-bottom:2.8rem;}
.pin-dots{display:flex;gap:12px;margin-bottom:2.2rem;}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line);background:transparent;transition:all .15s;}
.dot.on{background:var(--blue);border-color:var(--blue);box-shadow:0 0 7px rgba(59,130,246,.45);}
.dot.err{background:var(--red);border-color:var(--red);}
.pin-grid{display:grid;grid-template-columns:repeat(3,72px);gap:8px;}
.pin-grid button{
  height:56px;background:var(--s2);border:1px solid var(--line);
  border-radius:var(--r);color:var(--ink);font-size:1.2rem;
  font-family:'IBM Plex Mono',monospace;cursor:pointer;
}
.pin-grid button:active{background:var(--s3);border-color:var(--blue);transform:scale(.94);}
.pin-err{margin-top:1rem;font-size:.7rem;color:var(--red);min-height:1rem;text-align:center;font-family:'IBM Plex Mono',monospace;}

/* APP */
#app{display:none;min-height:100vh;flex-direction:column;}
#app.on{display:flex;animation:fi .3s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* HEADER */
.hdr{height:50px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;background:var(--s1);position:sticky;top:0;z-index:50;}
.hdr-l{display:flex;align-items:center;gap:.65rem;}
.hdr-mono{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--blue);letter-spacing:.08em;}
.hdr-sep{width:1px;height:14px;background:var(--line);}
.hdr-name{font-size:.82rem;font-weight:500;}
.hdr-r{display:flex;align-items:center;gap:.75rem;}
.live{display:flex;align-items:center;gap:4px;font-size:.6rem;color:var(--green);letter-spacing:.1em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.utag{font-size:.6rem;color:var(--ink3);font-family:'IBM Plex Mono',monospace;}

/* BODY */
.body{flex:1;padding:1.1rem 1.25rem 3rem;max-width:1100px;margin:0 auto;width:100%;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:.65rem;}
.spin{width:22px;height:22px;border:1.5px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:.72rem;color:var(--ink3);font-family:'IBM Plex Mono',monospace;}

/* BANNER */
.banner{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;border-radius:var(--r);border:1px solid;margin-bottom:1rem;}
.banner.crit{background:var(--r2);border-color:rgba(240,82,82,.25);}
.banner.ok{background:var(--g2);border-color:rgba(16,185,129,.25);}
.banner.warn{background:var(--a2);border-color:rgba(245,158,11,.25);}
.bd{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.banner.crit .bd{background:var(--red);animation:pulse 1.5s infinite;}
.banner.ok .bd{background:var(--green);}
.banner.warn .bd{background:var(--amber);}
.bt{font-size:.8rem;font-weight:500;}
.banner.crit .bt{color:var(--red);}
.banner.ok .bt{color:var(--green);}
.banner.warn .bt{color:var(--amber);}

/* KPI STRIP */
.ks{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;margin-bottom:1.1rem;}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:.8rem .9rem;position:relative;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0;}
.kpi.kr::before{background:var(--red);}
.kpi.ka::before{background:var(--amber);}
.kpi.kg::before{background:var(--green);}
.kpi.kb::before{background:var(--blue);}
.klbl{font-size:.56rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:.35rem;font-family:'IBM Plex Mono',monospace;}
.kval{font-size:1.5rem;font-weight:600;line-height:1;}
.kval.r{color:var(--red);}
.kval.a{color:var(--amber);}
.kval.g{color:var(--green);}
.knote{font-size:.58rem;color:var(--ink3);margin-top:.15rem;}

/* FILTERS */
.fbar{display:flex;gap:.45rem;margin-bottom:.85rem;}
.fb{font-size:.68rem;padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer;font-family:'IBM Plex Sans',sans-serif;}
.fb.on{background:var(--blue);border-color:var(--blue);color:#fff;}

/* SEC HDR */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem;}
.sh-title{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:.4rem;}
.sh-cnt{font-size:.6rem;padding:2px 7px;border-radius:10px;font-family:'IBM Plex Mono',monospace;font-weight:500;}
.sh-cnt.r{background:var(--r2);color:var(--red);}
.sh-cnt.a{background:var(--a2);color:var(--amber);}
.sh-cnt.g{background:var(--g2);color:var(--green);}

/* GASTO ROWS */
.gl{display:flex;flex-direction:column;gap:.45rem;margin-bottom:1.25rem;}
.gr-row{
  background:var(--s1);border:1px solid var(--line);border-radius:var(--r);
  padding:.85rem .95rem;display:grid;
  grid-template-columns:auto 1fr auto auto auto;
  gap:.8rem;align-items:center;
}
.gr-row.v{border-left:2px solid var(--red);}
.gr-row.a{border-left:2px solid var(--amber);}
.gr-row.g{border-left:2px solid var(--green);}

.sla{font-family:'IBM Plex Mono',monospace;font-size:.66rem;font-weight:500;padding:3px 8px;border-radius:4px;white-space:nowrap;flex-shrink:0;}
.sla.v{background:var(--r2);color:var(--red);}
.sla.a{background:var(--a2);color:var(--amber);}
.sla.g{background:var(--g2);color:var(--green);}

.gi-resp{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:.18rem;font-family:'IBM Plex Mono',monospace;}
.gi-desc{font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.22rem;}
.gi-tags{display:flex;gap:.35rem;flex-wrap:wrap;}
.tag{font-size:.58rem;padding:2px 5px;border-radius:3px;background:var(--s2);color:var(--ink3);}
.tag.neg{background:rgba(139,92,246,.1);color:#C4B5FD;}
.tag.sub{background:var(--b2);color:#93C5FD;}
.tag.tard{background:var(--a2);color:var(--amber);}
.tag.sf{background:var(--r2);color:var(--red);}

.monto{font-family:'IBM Plex Mono',monospace;font-size:.9rem;font-weight:500;text-align:right;white-space:nowrap;}
.fdate{font-size:.62rem;color:var(--ink3);font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;}

.foto-btn{display:inline-flex;align-items:center;gap:.3rem;font-size:.63rem;font-family:'IBM Plex Mono',monospace;padding:4px 8px;border-radius:4px;text-decoration:none;flex-shrink:0;white-space:nowrap;}
.foto-btn.has{background:var(--b2);color:var(--blue);border:1px solid rgba(59,130,246,.2);}
.foto-btn.has:hover{background:var(--blue);color:#fff;}
.foto-btn.no{background:var(--r2);color:var(--red);border:1px solid rgba(240,82,82,.2);}

.empty{text-align:center;padding:2.5rem 1rem;color:var(--ink3);font-size:.8rem;}

@media(max-width:800px){.ks{grid-template-columns:repeat(3,1fr);}.gr-row{grid-template-columns:auto 1fr auto;}.monto,.fdate,.foto-btn{font-size:.6rem;}}
@media(max-width:540px){.body{padding:.9rem;}.ks{grid-template-columns:repeat(2,1fr);}.gr-row{grid-template-columns:1fr;gap:.4rem;}}
</style>
</head>
<body>

<!-- ═══ PIN ═══ -->
<div id="pin-screen">
  <div class="pin-logo">PVI · 2026</div>
  <div class="pin-title">Ana</div>
  <div class="pin-sub">Revisión contable</div>
  <div class="pin-dots">
    <span class="dot" id="d0"></span><span class="dot" id="d1"></span>
    <span class="dot" id="d2"></span><span class="dot" id="d3"></span>
  </div>
  <div class="pin-grid">
    <button type="button" onclick="p('1')">1</button>
    <button type="button" onclick="p('2')">2</button>
    <button type="button" onclick="p('3')">3</button>
    <button type="button" onclick="p('4')">4</button>
    <button type="button" onclick="p('5')">5</button>
    <button type="button" onclick="p('6')">6</button>
    <button type="button" onclick="p('7')">7</button>
    <button type="button" onclick="p('8')">8</button>
    <button type="button" onclick="p('9')">9</button>
    <button type="button" onclick="clr()" style="font-size:.85rem">⌫</button>
    <button type="button" onclick="p('0')">0</button>
    <button type="button" style="visibility:hidden"></button>
  </div>
  <div class="pin-err" id="pin-err"></div>
</div>

<!-- ═══ APP ═══ -->
<div id="app">
  <div class="hdr">
    <div class="hdr-l">
      <div class="hdr-mono">PVI</div>
      <div class="hdr-sep"></div>
      <div class="hdr-name">Revisión de gastos — Ana</div>
    </div>
    <div class="hdr-r">
      <div class="live"><div class="ldot"></div>En vivo</div>
      <div class="utag" id="utag">—</div>
    </div>
  </div>

  <div class="body">
    <div class="loading" id="load-el"><div class="spin"></div><p>Cargando gastos...</p></div>
    <div id="main" style="display:none">

      <div class="banner crit" id="banner">
        <div class="bd"></div>
        <span class="bt" id="b-txt">—</span>
      </div>

      <div class="ks">
        <div class="kpi kr"><div class="klbl">SLA vencidos</div><div class="kval r" id="k-v">—</div><div class="knote">&gt;48 hrs</div></div>
        <div class="kpi ka"><div class="klbl">Pendientes</div><div class="kval a" id="k-p">—</div><div class="knote">esperando revisión</div></div>
        <div class="kpi kb"><div class="klbl">Monto total</div><div class="kval" id="k-m">—</div><div class="knote">en revisión</div></div>
        <div class="kpi kg"><div class="klbl">Con foto OK</div><div class="kval g" id="k-f">—</div></div>
        <div class="kpi kr"><div class="klbl">Sin foto</div><div class="kval r" id="k-sf">—</div></div>
      </div>

      <div class="fbar">
        <button class="fb on" onclick="sf('todos',this)">Todos</button>
        <button class="fb" onclick="sf('Carlos',this)">Carlos</button>
        <button class="fb" onclick="sf('Jethro',this)">Jethro</button>
        <button class="fb" onclick="sf('venc',this)">🔴 Vencidos</button>
      </div>

      <div id="sec-v">
        <div class="sh"><div class="sh-title">🔴 SLA Vencido<span class="sh-cnt r" id="cnt-v">0</span></div></div>
        <div class="gl" id="l-v"></div>
      </div>

      <div id="sec-a">
        <div class="sh"><div class="sh-title">⏳ En tiempo<span class="sh-cnt a" id="cnt-a">0</span></div></div>
        <div class="gl" id="l-a"></div>
      </div>

    </div>
  </div>
</div>

<script>
var AK = 'AIzaSyBL_gicAJD3zZ8Ils_-t42VyDhShPg_brg';
var SID = '1CQyRHmA99cfTar5kjvXgVvX9j6RKrTLUEHx-M5JhXyk';
var MONTHS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
var _buf = '';
var _PIN = '3200';
var _all = [];
var _mode = 'todos';

/* ── PIN ──────────────────────────────────────────────────────── */
function p(d) {
  if (_buf.length >= 4) return;
  _buf += d; _ud(false);
  if (_buf.length === 4) setTimeout(_vp, 80);
}
function clr() { _buf = _buf.slice(0,-1); document.getElementById('pin-err').textContent=''; _ud(false); }
function _ud(e) {
  for (var i=0;i<4;i++) {
    var el=document.getElementById('d'+i);
    el.className='dot'+(i<_buf.length?(e?' err':' on'):'');
  }
}
function _vp() {
  if (_buf === _PIN) {
    var ps=document.getElementById('pin-screen');
    ps.style.transition='opacity .28s';ps.style.opacity='0';
    setTimeout(function(){ps.style.display='none';document.getElementById('app').classList.add('on');_load();},280);
  } else {
    _ud(true);document.getElementById('pin-err').textContent='PIN incorrecto';
    setTimeout(function(){_buf='';_ud(false);document.getElementById('pin-err').textContent='';},750);
  }
}

/* ── HELPERS ──────────────────────────────────────────────────── */
function _mxn(v){
  if(!v&&v!==0)return 0;var s=String(v).replace(/\$/g,'').replace(/\s/g,'').trim();
  if(/\.\d{3}$/.test(s)||/\.\d{3}\./.test(s))s=s.replace(/\./g,'');
  s=s.replace(',','.');var n=parseFloat(s);return isNaN(n)?0:n;
}
function _pd(s){if(!s)return null;var d=new Date(String(s).trim());return isNaN(d.getTime())?null:d;}
function _fmt(n){return'$'+Math.round(_mxn(n)).toLocaleString('es-MX');}
function _fd(d){if(!d)return'—';return d.getDate()+' '+MONTHS[d.getMonth()];}
function _gr(r){return fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SID+'/values/'+encodeURIComponent(r)+'?key='+AK).then(function(x){return x.json();}).then(function(j){return j.values||[];});}

/* ── FILTER ───────────────────────────────────────────────────── */
function sf(mode, el) {
  _mode = mode;
  document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('on');});
  if(el) el.classList.add('on');
  _draw();
}

/* ── LOAD ─────────────────────────────────────────────────────── */
function _load() {
  _gr('GASTOS!A6:T2000').then(function(rows) {
    var pend = rows.filter(function(r) {
      if(r.length < 17) return false;
      var est = (r[16]||'').toString().trim();
      return est.indexOf('Pendiente') >= 0 || (!est.includes('Aprobado') && !est.includes('Revisado'));
    });

    var tot=0, venc=0, sinF=0, conF=0;
    _all = pend.map(function(r) {
      var m = _mxn(r[9]); tot += m;
      var sla = (r[19]||'').toString();
      var isV = sla.indexOf('VENCIDO') >= 0;
      var hrs = 0; var hm = sla.match(/(\d+)hrs/); if(hm) hrs = parseInt(hm[1]);
      if(isV) venc++;
      var af = (r[15]||'').toString();
      var hasFoto = af.indexOf('SIN FOTO') < 0 && (r[11]||'').toString().trim() !== '';
      if(hasFoto) conF++; else sinF++;
      return {r:r, m:m, isV:isV, hrs:hrs, hasFoto:hasFoto, resp:(r[3]||'').toString().trim()};
    });

    /* KPIs */
    document.getElementById('k-v').textContent = venc;
    document.getElementById('k-p').textContent = pend.length;
    document.getElementById('k-m').textContent = _fmt(tot);
    document.getElementById('k-f').textContent = conF;
    document.getElementById('k-sf').textContent = sinF;

    /* Banner */
    var bn=document.getElementById('banner'), bt=document.getElementById('b-txt');
    if(venc>0){bn.className='banner crit';bt.style.color='var(--red)';bt.textContent=venc+' gastos con SLA vencido — revisión urgente';}
    else if(pend.length>0){bn.className='banner warn';bt.style.color='var(--amber)';bt.textContent=pend.length+' gastos pendientes dentro del SLA';}
    else{bn.className='banner ok';bt.style.color='var(--green)';bt.textContent='Todo al día — sin gastos pendientes';}

    _draw();

    document.getElementById('load-el').style.display='none';
    document.getElementById('main').style.display='block';
    document.getElementById('utag').textContent=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  }).catch(function(e){
    document.getElementById('load-el').innerHTML='<p style="color:var(--red);text-align:center;font-size:.8rem">Error: '+e.message+'</p>';
  });
}

/* ── DRAW ─────────────────────────────────────────────────────── */
function _draw() {
  var rows = _all;
  if(_mode==='Carlos') rows=rows.filter(function(x){return x.resp==='Carlos';});
  else if(_mode==='Jethro') rows=rows.filter(function(x){return x.resp==='Jethro';});
  else if(_mode==='venc') rows=rows.filter(function(x){return x.isV;});

  var v=rows.filter(function(x){return x.isV;}).sort(function(a,b){return b.hrs-a.hrs;});
  var a=rows.filter(function(x){return !x.isV;});

  document.getElementById('cnt-v').textContent=v.length;
  document.getElementById('cnt-a').textContent=a.length;

  var lv=document.getElementById('l-v'), la=document.getElementById('l-a');
  lv.innerHTML=v.length?v.map(_gr_row).join(''):'<div class="empty">✅ Sin SLA vencidos</div>';
  la.innerHTML=a.length?a.map(_gr_row).join(''):'<div class="empty">Sin gastos en tiempo</div>';
  document.getElementById('sec-v').style.display=v.length||_mode!=='venc'?'block':'none';
}

function _gr_row(g) {
  var sla=(g.r[19]||'').toString();
  var hm=sla.match(/(\d+)hrs/); var hrs=hm?parseInt(hm[1]):0;
  var slaLbl=g.isV?('⚠ '+hrs+'h vencido'):(hrs+'h restantes');
  var slaCls=g.isV?'v':(hrs<12?'a':'g');
  var rowCls=g.isV?'v':(hrs<12?'a':'g');
  var neg=(g.r[4]||'').toString().trim();
  var sub=(g.r[6]||'').toString().trim();
  var desc=(g.r[7]||'Sin descripción').toString().trim();
  var foto=(g.r[11]||'').toString().trim();
  var af=(g.r[15]||'').toString();
  var tard=(g.r[14]||'').toString();
  var f=_pd(g.r[2]);
  return '<div class="gr-row '+rowCls+'">'
    +'<div class="sla '+slaCls+'">'+slaLbl+'</div>'
    +'<div><div class="gi-resp">'+g.resp+' · '+_fd(f)+'</div>'
    +'<div class="gi-desc" title="'+desc+'">'+desc+'</div>'
    +'<div class="gi-tags">'
    +(neg?'<span class="tag neg">'+neg+'</span>':'')
    +(sub?'<span class="tag sub">'+sub+'</span>':'')
    +(tard.indexOf('TARDÍO')>=0?'<span class="tag tard">⏰ tardío</span>':'')
    +(!g.hasFoto?'<span class="tag sf">📸 sin foto</span>':'')
    +'</div></div>'
    +'<div class="monto">'+_fmt(g.m)+'<br><span class="fdate">'+((g.r[10]||'').toString().trim()||'—')+'</span></div>'
    +(foto&&g.hasFoto
      ?'<a href="'+foto+'" target="_blank" class="foto-btn has">📎 Ver foto</a>'
      :'<span class="foto-btn no">📸 Sin foto</span>')
    +'</div>';
}
</script>
</body>
</html>
