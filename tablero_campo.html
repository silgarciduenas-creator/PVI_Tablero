<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PVI · Tablero Campo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#060c06;--card:#0b140b;--b2:#0f1f0f;--bdr:#1a3a1a;--g1:#4ade80;--g2:#22c55e;--g3:#16a34a;--g4:#86efac;--teal:#2dd4bf;--yel:#fbbf24;--ora:#fb923c;--red:#f87171;--txt:#f0fdf4;--sub:#6b9e6b;--mono:'Space Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--txt)}
#pin-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);position:relative}
#pin-screen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 30%,rgba(34,197,94,.07) 0%,transparent 70%);pointer-events:none}
.pin-logo{font-family:var(--mono);font-size:.65rem;letter-spacing:.3em;color:var(--g3);margin-bottom:2rem;border:1px solid var(--bdr);padding:.3rem .8rem;border-radius:6px}
.pin-title{font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--g1),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
.pin-sub{font-size:.82rem;color:var(--sub);font-family:var(--mono);margin-bottom:3rem}
.pin-dots{display:flex;gap:1.2rem;margin-bottom:2rem}
.pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--bdr);transition:all .2s}
.pin-dot.filled{background:var(--g1);border-color:var(--g1);box-shadow:0 0 10px var(--g1)}
.pin-pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px}
.pkey{height:76px;border-radius:14px;border:1px solid var(--bdr);background:var(--card);color:var(--txt);font-size:1.5rem;font-weight:700;cursor:pointer;transition:all .15s;font-family:'Space Grotesk',sans-serif}
.pkey:hover{background:var(--b2);border-color:var(--g3);color:var(--g1)}.pkey:active{transform:scale(.93)}
.pkey.del{color:var(--red)}.pkey.zero{grid-column:2}
.pin-err{color:var(--red);font-size:.82rem;margin-top:1rem;height:1.2rem;text-align:center;font-family:var(--mono)}
#dashboard{display:none}
/* Topbar personalized per user */
.topbar{padding:.85rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--bdr)}
.topbar.car{background:rgba(11,20,11,.95);border-bottom-color:rgba(74,222,128,.2)}
.topbar.jet{background:rgba(11,20,11,.95);border-bottom-color:rgba(45,212,191,.2)}
.t-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800}
.t-avatar.car{background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.3);color:var(--g1)}
.t-avatar.jet{background:rgba(45,212,191,.15);border:1px solid rgba(45,212,191,.3);color:var(--teal)}
.t-name{font-size:1rem;font-weight:700}.t-name.car{color:var(--g1)}.t-name.jet{color:var(--teal)}
.t-per{font-size:.72rem;color:var(--sub);font-family:var(--mono)}
.rbtn{background:none;border:1px solid var(--bdr);color:var(--sub);border-radius:8px;padding:.32rem .7rem;font-size:.78rem;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .15s}
.rbtn:hover{border-color:var(--g3);color:var(--g1)}
.page{max-width:500px;margin:0 auto;padding:1.1rem}
.sl{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--g3);font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.sl::after{content:'';flex:1;height:1px;background:var(--bdr)}
/* Main fondo card */
.fc-main{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:1rem;border:1px solid var(--bdr)}
.fc-hero{padding:1.25rem;border-bottom:1px solid var(--bdr)}
.fc-hero.car{background:linear-gradient(135deg,rgba(74,222,128,.08) 0%,transparent 100%);border-bottom-color:rgba(74,222,128,.15)}
.fc-hero.jet{background:linear-gradient(135deg,rgba(45,212,191,.08) 0%,transparent 100%);border-bottom-color:rgba(45,212,191,.15)}
.fc-hero-label{font-size:.65rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--sub);margin-bottom:.4rem}
.fc-hero-amount{font-size:2.4rem;font-weight:800;font-family:var(--mono);line-height:1}
.fc-hero-amount.car{color:var(--g1)}.fc-hero-amount.jet{color:var(--teal)}
.fc-hero-period{font-size:.78rem;color:var(--sub);margin-top:.3rem;font-family:var(--mono)}
.fc-rows{padding:.2rem 0}
.fr{display:flex;justify-content:space-between;align-items:center;padding:.52rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.025)}
.fr:last-child{border-bottom:none}
.fr .fl{font-size:.85rem;color:var(--sub)}.fr .fv{font-size:.9rem;font-weight:700;font-family:var(--mono)}
.fr .fv.big{font-size:1.15rem}.fv.G{color:var(--g1)}.fv.R{color:var(--red)}.fv.Y{color:var(--yel)}.fv.T{color:var(--teal)}.fv.O{color:var(--ora)}
.fc-footer{padding:.6rem 1.1rem;background:rgba(0,0,0,.2);border-top:1px solid var(--bdr);font-family:var(--mono);font-size:.7rem;text-align:center}
/* Chart */
.cc{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:1.1rem;margin-bottom:1rem}
.cc h3{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin-bottom:1rem}
.cw{position:relative;height:180px}
/* Acumulado */
.acu{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:1rem;margin-bottom:1rem}
.acu-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:700;margin-bottom:.75rem}
.acu-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.acu-item .al{font-size:.65rem;color:var(--sub);margin-bottom:2px}
.acu-item .av{font-size:1.1rem;font-weight:800;font-family:var(--mono);color:var(--g1)}
/* Gastos recientes */
.rec{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:1rem;margin-bottom:1rem}
.rec-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:700;margin-bottom:.75rem}
.gr{display:flex;justify-content:space-between;align-items:flex-start;padding:.48rem 0;border-bottom:1px solid rgba(255,255,255,.03)}
.gr:last-child{border-bottom:none}
.gr .gl{flex:1}
.gr .gd{font-size:.85rem;font-weight:600}
.gr .gs{font-size:.7rem;color:var(--sub);margin-top:2px}
.gr .gm{font-size:.92rem;font-weight:700;font-family:var(--mono);color:var(--ora)}
.estado{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.estado.P{background:#fbbf24}.estado.R{background:#2dd4bf}.estado.A{background:#4ade80}.estado.O{background:#fb923c}
/* Form link */
.form-link{display:flex;align-items:center;justify-content:center;gap:.5rem;background:var(--g2);color:var(--bg);border-radius:14px;padding:1rem;text-decoration:none;font-size:.95rem;font-weight:800;margin-top:.25rem;text-align:center;transition:background .15s}
.form-link:hover{background:var(--g1)}
.loading{text-align:center;padding:2rem;color:var(--sub);font-family:var(--mono)}
</style>
</head>
<body>
<div id="pin-screen">
  <div class="pin-logo">PVI · Control Operativo 2026</div>
  <div class="pin-title">Tablero Campo</div>
  <div class="pin-sub">Carlos · Jethro</div>
  <div class="pin-dots"><div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div><div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div></div>
  <div class="pin-pad">
    <button class="pkey" onclick="addPin('1')">1</button><button class="pkey" onclick="addPin('2')">2</button><button class="pkey" onclick="addPin('3')">3</button>
    <button class="pkey" onclick="addPin('4')">4</button><button class="pkey" onclick="addPin('5')">5</button><button class="pkey" onclick="addPin('6')">6</button>
    <button class="pkey" onclick="addPin('7')">7</button><button class="pkey" onclick="addPin('8')">8</button><button class="pkey" onclick="addPin('9')">9</button>
    <button class="pkey del" onclick="delPin()">⌫</button><button class="pkey zero" onclick="addPin('0')">0</button>
  </div>
  <div class="pin-err" id="pin-err"></div>
</div>

<div id="dashboard">
  <div class="topbar" id="topbar">
    <div style="display:flex;align-items:center;gap:.75rem">
      <div class="t-avatar" id="t-avatar">—</div>
      <div><div class="t-name" id="t-name">—</div><div class="t-per" id="t-per">—</div></div>
    </div>
    <button class="rbtn" onclick="loadData()">↻</button>
  </div>
  <div class="page">
    <div class="fc-main" id="fc-main"><div class="loading">Cargando...</div></div>
    <div class="cc" id="cc-chart" style="display:none"><h3>📊 Desglose del fondo</h3><div class="cw"><canvas id="cFondo"></canvas></div></div>
    <div class="acu" id="acu" style="display:none"></div>
    <div class="rec" id="rec" style="display:none"></div>
    <a class="form-link" href="https://docs.google.com/forms/d/e/1FAIpQLSck8k2DphEzjXUCWrirWOhqJa0Top2c_2CC40cfIcKRhWBgRA/viewform" target="_blank">
      ➕ Registrar gasto o ingreso
    </a>
  </div>
</div>

<script>
const K='AIzaSyBL_gicAJD3zZ8Ils_-t42VyDhShPg_brg',S='1CQyRHmA99cfTar5kjvXgVvX9j6RKrTLUEHx-M5JhXyk';
const PINS={'2403':'Carlos','1748':'Jethro'};
let charts={},buf='',user='';

function addPin(d){
  if(buf.length>=4)return;buf+=d;document.getElementById('d'+(buf.length-1)).classList.add('filled');
  if(buf.length===4){
    if(PINS[buf]){user=PINS[buf];document.getElementById('pin-screen').style.display='none';document.getElementById('dashboard').style.display='block';loadData();}
    else{document.getElementById('pin-err').textContent='PIN incorrecto';setTimeout(()=>{buf='';[0,1,2,3].forEach(i=>document.getElementById('d'+i).classList.remove('filled'));document.getElementById('pin-err').textContent='';},800);}
  }
}
function delPin(){if(!buf.length)return;document.getElementById('d'+(buf.length-1)).classList.remove('filled');buf=buf.slice(0,-1);}

async function bat(rr){const p=rr.map(r=>`ranges=${encodeURIComponent(r)}`).join('&');const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${S}/values:batchGet?${p}&key=${K}`);return((await res.json()).valueRanges||[]).map(v=>v.values?.[0]?.[0]??'0');}
async function get(r){const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${S}/values/${encodeURIComponent(r)}?key=${K}`);return(await res.json()).values||[];}
function n(x){return parseFloat(String(x||0).replace(/\$/g,'').replace(/,/g,'').replace(/\.(?=\d{3}(\.|$))/g,''))||0;}
function mx(x){const v=n(x);return'$'+v.toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0});}
function smCls(s){s=String(s||'');return s.includes('🔴')||s.includes('CRÍTICO')?'R':s.includes('🟡')?'Y':'G';}

function mk(id,type,labels,datasets){
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(document.getElementById(id).getContext('2d'),{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#6b9e6b',font:{family:'Space Grotesk',size:10},boxWidth:8,padding:10}},tooltip:{backgroundColor:'#0b140b',borderColor:'#1a3a1a',borderWidth:1,titleColor:'#f0fdf4',bodyColor:'#86efac',callbacks:{label:c=>' $'+Math.round(c.raw||0).toLocaleString('es-MX')}}},scales:type==='doughnut'?{}:{x:{ticks:{color:'#6b9e6b',font:{size:10}},grid:{color:'rgba(26,58,26,.4)'}},y:{ticks:{color:'#6b9e6b',font:{size:10},callback:v=>'$'+v.toLocaleString('es-MX')},grid:{color:'rgba(26,58,26,.4)'},beginAtZero:true}}}});
}

async function loadData(){
  const isC=user==='Carlos';const cls=isC?'car':'jet';
  const tb=document.getElementById('topbar');tb.className='topbar '+(isC?'car':'jet');
  document.getElementById('t-avatar').className='t-avatar '+cls;
  document.getElementById('t-avatar').textContent=isC?'C':'J';
  document.getElementById('t-name').className='t-name '+cls;
  document.getElementById('t-name').textContent='👷 '+user;

  const cells=isC
    ?await bat(['SEMANA_ACTIVA!E5','SEMANA_ACTIVA!E7','SEMANA_ACTIVA!E13','SEMANA_ACTIVA!E14','SEMANA_ACTIVA!E15','SEMANA_ACTIVA!E16','SEMANA_ACTIVA!E17','SEMANA_ACTIVA!E18','SEMANA_ACTIVA!E22','SEMANA_ACTIVA!E23','SEMANA_ACTIVA!E24'])
    :await bat(['SEMANA_ACTIVA!E5','SEMANA_ACTIVA!E8','SEMANA_ACTIVA!E29','SEMANA_ACTIVA!E30','SEMANA_ACTIVA!E31','SEMANA_ACTIVA!E32','SEMANA_ACTIVA!E33','SEMANA_ACTIVA!E34','SEMANA_ACTIVA!E38','SEMANA_ACTIVA!E39','SEMANA_ACTIVA!E40']);

  const [per,fo,ga,pe,re,ig,di,sm,gaA,peA,rgA]=cells;
  document.getElementById('t-per').textContent='Semana: '+per;

  const smC=smCls(sm);
  document.getElementById('fc-main').innerHTML=`
    <div class="fc-hero ${cls}">
      <div class="fc-hero-label">Fondo semanal</div>
      <div class="fc-hero-amount ${cls}">${mx(fo)}</div>
      <div class="fc-hero-period">${per}</div>
    </div>
    <div class="fc-rows">
      <div class="fr"><span class="fl">Gastado (aprobado)</span><span class="fv O">${mx(ga)}</span></div>
      <div class="fr"><span class="fl">Pendiente de aprobar</span><span class="fv Y">${mx(pe)}</span></div>
      <div class="fr"><span class="fl">Repuesto por Laura</span><span class="fv G">+${mx(re)}</span></div>
      <div class="fr"><span class="fl">💵 Ingresos al fondo</span><span class="fv T">+${mx(ig)}</span></div>
      <div class="fr"><span class="fl" style="font-weight:700">Disponible real</span><span class="fv big ${smC}">${mx(di)}</span></div>
    </div>
    <div class="fc-footer">${sm}</div>`;

  // Doughnut chart
  document.getElementById('cc-chart').style.display='block';
  mk('cFondo','doughnut',['Gastado','Pendiente','Ingresos','Repuesto','Disponible'],[{data:[n(ga),n(pe),n(ig),n(re),Math.max(0,n(di)-n(re)-n(ig))],backgroundColor:['rgba(251,191,36,.3)','rgba(248,113,113,.2)','rgba(45,212,191,.3)','rgba(74,222,128,.2)','rgba(74,222,128,.1)'],borderColor:['#fbbf24','#f87171','#2dd4bf','#4ade80','#4ade8055'],borderWidth:2}]);

  // Acumulado
  const acuEl=document.getElementById('acu');acuEl.style.display='block';
  acuEl.innerHTML=`<div class="acu-title">Acumulado al cierre</div><div class="acu-grid"><div class="acu-item"><div class="al">Total gastado aprobado</div><div class="av" style="color:${isC?'var(--g1)':'var(--teal)'}">${mx(gaA)}</div></div><div class="acu-item"><div class="al">Pendiente</div><div class="av" style="color:var(--yel)">${mx(peA)}</div></div><div class="acu-item"><div class="al">Total registrado</div><div class="av">${mx(rgA)}</div></div></div>`;

  // Recent gastos
  try{
    const rows=await get('GASTOS!A6:T80');
    const mine=rows.filter(r=>(r[3]||'').toLowerCase()===user.toLowerCase()&&n(r[9])>0);
    mine.sort((a,b)=>new Date(b[0]||0)-new Date(a[0]||0));
    const rec=mine.slice(0,6);
    const recEl=document.getElementById('rec');recEl.style.display='block';
    recEl.innerHTML=`<div class="rec-title">Últimos gastos</div>`+(rec.length?rec.map(r=>{
      const e=r[16]||'';const dot=e.includes('Aprobado')?'A':e.includes('Revisado')?'R':e.includes('Observ')?'O':'P';
      return`<div class="gr"><div class="gl"><div class="gd">${r[7]||r[4]||'—'}</div><div class="gs"><span class="estado ${dot}"></span>${r[4]||''} · ${r[2]||''}</div></div><div class="gm">${mx(r[9])}</div></div>`;
    }).join(''):'<div style="color:var(--sub);font-size:.82rem">Sin gastos registrados aún</div>');
  }catch(e){}
}
</script>
</body>
</html>
