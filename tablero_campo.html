<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>PVI — Tablero de Campo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #060d1f;
      --s1:     #0d1730;
      --s2:     #172040;
      --s3:     #1f2d52;
      --border: rgba(255,255,255,0.08);
      --text:   #e8eeff;
      --muted:  #5a6a92;
      --gold:   #f59e0b;
      --green:  #22c55e;
      --yellow: #eab308;
      --red:    #ef4444;
      --blue:   #60a5fa;
      --fn:     'Barlow Condensed', sans-serif;
      --fb:     'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--fb);
      font-size: 15px;
      min-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== PIN ===== */
    #pin-screen {
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px;
      background: radial-gradient(ellipse 90% 50% at 50% 30%, rgba(245,158,11,0.07) 0%, transparent 70%);
    }
    .pin-brand {
      font-family: var(--fn);
      font-size: 48px; font-weight: 800;
      letter-spacing: 5px;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .pin-sub {
      font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 44px;
    }
    .dots {
      display: flex; gap: 14px; margin-bottom: 32px;
    }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--s3);
      background: transparent;
      transition: all 0.15s;
    }
    .dot.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px rgba(245,158,11,0.4); }
    .num-pad {
      display: grid; grid-template-columns: repeat(3, 80px);
      gap: 8px;
    }
    .nb {
      height: 72px;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: var(--fn);
      font-size: 26px; font-weight: 600;
      cursor: pointer;
      transition: all 0.12s;
      display: flex; align-items: center; justify-content: center;
    }
    .nb:active { background: rgba(245,158,11,0.15); border-color: var(--gold); transform: scale(0.96); }
    .nb.sm { font-size: 16px; font-family: var(--fb); color: var(--muted); }
    .pin-err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 14px; }

    /* ===== MAIN ===== */
    #main { display: none; min-height: 100dvh; flex-direction: column; }

    /* ===== TOP BAR ===== */
    .top-bar {
      background: var(--s1);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 52px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .tb-left { display: flex; align-items: center; gap: 10px; }
    .tb-brand { font-family: var(--fn); font-size: 18px; font-weight: 800; letter-spacing: 3px; color: var(--gold); }
    .tb-user {
      font-size: 12px; font-weight: 600;
      background: var(--s3);
      border-radius: 20px;
      padding: 3px 10px;
      color: var(--text);
      letter-spacing: 0.5px;
    }
    .tb-refresh {
      background: none; border: none;
      color: var(--muted); font-size: 18px;
      cursor: pointer; padding: 8px;
      transition: color 0.15s;
    }
    .tb-refresh:active { color: var(--gold); }

    /* ===== CONTENT ===== */
    .content { padding: 16px; flex: 1; }

    /* ===== FONDO CARD ===== */
    .fondo-card {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    .fondo-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }
    .fondo-card.ok::before    { background: var(--green); }
    .fondo-card.warn::before  { background: var(--yellow); }
    .fondo-card.crit::before  { background: var(--red); }

    .fc-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .fc-title { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .fc-sem { font-size: 28px; }

    .fc-main {
      display: flex; align-items: flex-end; gap: 6px;
      margin-bottom: 6px;
    }
    .fc-available {
      font-family: var(--fn);
      font-size: 48px; font-weight: 700;
      line-height: 1;
    }
    .fc-available.ok   { color: var(--green); }
    .fc-available.warn { color: var(--yellow); }
    .fc-available.crit { color: var(--red); }
    .fc-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }

    .fc-bar-wrap {
      background: var(--s2);
      border-radius: 4px; height: 5px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .fc-bar {
      height: 100%; border-radius: 4px;
      transition: width 0.6s ease;
    }

    .fc-rows { display: flex; flex-direction: column; gap: 0; }
    .fc-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .fc-row:last-child { border-bottom: none; }
    .fc-rlbl { font-size: 13px; color: var(--muted); }
    .fc-rval { font-family: var(--fn); font-size: 18px; font-weight: 600; }
    .c-green  { color: var(--green); }
    .c-yellow { color: var(--yellow); }
    .c-red    { color: var(--red); }
    .c-muted  { color: var(--muted); }

    /* ===== SEMANA INFO ===== */
    .semana-chip {
      background: var(--s2);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
      font-size: 12px; color: var(--muted);
    }
    .semana-chip span { font-weight: 600; color: var(--text); }

    /* ===== GASTOS LIST ===== */
    .sec-hdr {
      font-size: 10px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .gasto-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .gasto-item {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .gi-estado { font-size: 18px; flex-shrink: 0; }
    .gi-body { flex: 1; min-width: 0; }
    .gi-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
    .gi-neg { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
    .gi-desc {
      font-size: 14px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }
    .gi-monto { font-family: var(--fn); font-size: 17px; font-weight: 700; flex-shrink: 0; }
    .gi-bottom {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 4px;
    }
    .gi-fecha { font-size: 11px; color: var(--muted); }
    .gi-badge {
      font-size: 10px; padding: 2px 7px; border-radius: 10px;
      font-weight: 500;
    }
    .gb-pendiente  { background: rgba(234,179,8,0.12);  color: #fde68a; }
    .gb-observacion{ background: rgba(249,115,22,0.12); color: #fed7aa; }
    .gb-revisado   { background: rgba(96,165,250,0.12); color: #93c5fd; }
    .gb-aprobado   { background: rgba(34,197,94,0.12);  color: #86efac; }

    /* ===== EMPTY / LOADING ===== */
    .empty {
      text-align: center; padding: 40px 20px;
      color: var(--muted); font-size: 14px;
    }
    .loading-inline {
      display: flex; align-items: center; gap: 8px;
      color: var(--muted); font-size: 13px;
      padding: 16px 0;
    }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== ERROR BOX ===== */
    .err-box {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 12px;
      padding: 14px 16px;
      color: #fca5a5;
      font-size: 13px;
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .err-box strong { display: block; margin-bottom: 6px; }
    .err-fix { color: var(--muted); font-size: 12px; margin-top: 8px; }

    /* ===== UPDATE ===== */
    .update-bar {
      padding: 8px 16px;
      font-size: 11px; color: var(--muted);
      background: var(--s1);
      border-top: 1px solid var(--border);
      text-align: center;
    }

    /* ===== DEBUG ===== */
    .dbg {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 10px; font-family: monospace;
      margin-top: 8px;
    }
    .dbg summary { padding: 10px 14px; cursor: pointer; color: var(--muted); }
    .dbg-body {
      padding: 0 14px 14px;
      color: var(--muted);
      max-height: 220px; overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<!-- ========== PIN ========== -->
<div id="pin-screen">
  <div class="pin-brand">PVI</div>
  <div class="pin-sub">Tablero de Campo</div>
  <div class="dots" id="dots">
    <div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div>
  </div>
  <div class="num-pad">
    <button class="nb" onclick="p('1')">1</button>
    <button class="nb" onclick="p('2')">2</button>
    <button class="nb" onclick="p('3')">3</button>
    <button class="nb" onclick="p('4')">4</button>
    <button class="nb" onclick="p('5')">5</button>
    <button class="nb" onclick="p('6')">6</button>
    <button class="nb" onclick="p('7')">7</button>
    <button class="nb" onclick="p('8')">8</button>
    <button class="nb" onclick="p('9')">9</button>
    <button class="nb sm" onclick="pDel()">⌫</button>
    <button class="nb" onclick="p('0')">0</button>
    <button class="nb sm" onclick="pClr()">✕</button>
  </div>
  <div class="pin-err" id="pin-err"></div>
</div>

<!-- ========== MAIN ========== -->
<div id="main" style="display:none;flex-direction:column">

  <div class="top-bar">
    <div class="tb-left">
      <div class="tb-brand">PVI</div>
      <div class="tb-user" id="tb-user">—</div>
    </div>
    <button class="tb-refresh" onclick="loadData()" title="Actualizar">↻</button>
  </div>

  <div class="content">
    <div id="err-box"></div>
    <div class="loading-inline" id="loading"><span class="spin">◌</span> Conectando…</div>
    <div id="content-wrap" style="display:none">

      <!-- Semana info -->
      <div class="semana-chip">
        <span>Semana <span id="sem-num">—</span></span>
        <span id="sem-rango">—</span>
      </div>

      <!-- Fondo Card -->
      <div class="fondo-card" id="fondo-card">
        <div class="fc-header">
          <div class="fc-title">Saldo disponible</div>
          <div class="fc-sem" id="fc-sem">—</div>
        </div>
        <div class="fc-main">
          <div class="fc-available" id="fc-available">—</div>
        </div>
        <div class="fc-label">de <span id="fc-fondo-total">—</span> asignados esta semana</div>
        <div class="fc-bar-wrap"><div class="fc-bar" id="fc-bar" style="width:0%"></div></div>
        <div class="fc-rows">
          <div class="fc-row"><span class="fc-rlbl">Gastado</span><span class="fc-rval" id="fc-gastado">—</span></div>
          <div class="fc-row"><span class="fc-rlbl">Aprobado ✓</span><span class="fc-rval c-green" id="fc-aprobado">—</span></div>
          <div class="fc-row"><span class="fc-rlbl">Pendiente aprobación</span><span class="fc-rval c-yellow" id="fc-pendiente">—</span></div>
        </div>
      </div>

      <!-- Mis gastos esta semana -->
      <div class="sec-hdr">
        <span>Mis gastos — esta semana</span>
        <span id="sem-count" style="color:var(--text)">0</span>
      </div>
      <div class="gasto-list" id="gasto-list"></div>

      <!-- Gastos anteriores -->
      <div class="sec-hdr" style="margin-top:8px">
        <span>Gastos anteriores</span>
        <span id="ant-count" style="color:var(--text)">0</span>
      </div>
      <div class="gasto-list" id="ant-list"></div>

    </div><!-- /content-wrap -->

    <!-- Debug -->
    <details class="dbg">
      <summary>🔧 Diagnóstico (Silvia)</summary>
      <div class="dbg-body" id="dbg-body">—</div>
    </details>
  </div><!-- /content -->

  <div class="update-bar" id="update-bar">—</div>

</div><!-- /main -->

<script>
/* ========================================
   CONFIG
   ======================================== */
const CFG = {
  SHEET_ID: '1CQyRHmA99cfTar5kjvXgVvX9j6RKrTLUEHx-M5JhXyk',
  API_KEY:  'AIzaSyBL_gicAJD3zZ8Ils_-t42VyDhShPg_brg',
  USERS: {
    '2403': { name: 'Carlos', fondo: 118380 },
    '1748': { name: 'Jethro', fondo: 40000  },
  },
  SALDO_CRITICO: 5000,
  SALDO_ALERTA:  10000,
};

let currentUser = null;
let dbg = [];
function log(s) { dbg.push(s); }

/* ========================================
   PIN
   ======================================== */
let pinVal = '';
function p(d) {
  if (pinVal.length >= 4) return;
  pinVal += d;
  renderDots();
  if (pinVal.length === 4) checkPin();
}
function pDel() { pinVal = pinVal.slice(0,-1); renderDots(); }
function pClr() { pinVal = ''; renderDots(); }
function renderDots() {
  document.querySelectorAll('.dot').forEach((el,i) => el.classList.toggle('on', i < pinVal.length));
}
function checkPin() {
  if (CFG.USERS[pinVal]) {
    currentUser = CFG.USERS[pinVal];
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('main').style.display = 'flex';
    document.getElementById('tb-user').textContent = currentUser.name;
    loadData();
  } else {
    document.getElementById('pin-err').textContent = 'PIN incorrecto';
    setTimeout(() => { pinVal=''; renderDots(); document.getElementById('pin-err').textContent=''; }, 1200);
  }
}

/* ========================================
   API
   ======================================== */
async function fetchRange(range) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${CFG.SHEET_ID}/values/${encodeURIComponent(range)}?key=${CFG.API_KEY}`;
  log(`▶ FETCH: ${range}`);
  const r = await fetch(url);
  log(`  STATUS: ${r.status}`);
  if (!r.ok) {
    const body = await r.json().catch(()=>({}));
    const msg  = body.error?.message || `HTTP ${r.status}`;
    log(`  ERROR: ${msg}`);
    throw new Error(msg);
  }
  const data = await r.json();
  const rows = data.values || [];
  log(`  ROWS: ${rows.length}`);
  return rows;
}

/* ========================================
   PARSE
   ======================================== */
function parseMXN(v) {
  if (!v && v!==0) return 0;
  const s = String(v).replace(/[$\s]/g,'').trim();
  const c = s.replace(/\.(?=\d{3}(\.|$))/g,'').replace(',','.');
  return parseFloat(c)||0;
}
function fmtMXN(n) {
  if (!n && n!==0) return '—';
  return '$'+Math.round(n).toLocaleString('es-MX');
}
function parseDate(v) {
  if (!v) return null;
  const m = String(v).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (m) return new Date(+m[3],+m[2]-1,+m[1]);
  const d = new Date(v); return isNaN(d)?null:d;
}
function isoWeek(d) {
  const dt = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day = dt.getUTCDay()||7;
  dt.setUTCDate(dt.getUTCDate()+4-day);
  const y0 = new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil((((dt-y0)/864e5)+1)/7);
}
function mapHdr(row) {
  const m={};
  (row||[]).forEach((h,i)=>{ m[String(h).toLowerCase().trim()]=i; });
  return m;
}
function col(m,...keys) {
  for (const k of keys) if (m[k]!==undefined) return m[k];
  return -1;
}
function getVal(r,i) { return i>=0?(r[i]||''):''; }

/* ========================================
   LOAD
   ======================================== */
async function loadData() {
  dbg = [];
  log(`=== PVI CAMPO — ${currentUser.name} ===`);
  log(`${new Date().toLocaleString('es-MX')}`);

  document.getElementById('err-box').innerHTML      = '';
  document.getElementById('loading').style.display  = 'flex';
  document.getElementById('content-wrap').style.display = 'none';

  try {
    const raw = await fetchRange('GASTOS!A:Q');
    if (raw.length < 2) throw new Error('Tab GASTOS vacía o nombre incorrecto.');

    const hdr = mapHdr(raw[0]);
    log(`\nHEADERS: ${raw[0].join(' | ')}`);

    const CI = {
      fecha:   col(hdr,'fecha','fecha de compra','marca temporal'),
      semana:  col(hdr,'semana','semana #','# semana'),
      negocio: col(hdr,'negocio','empresa','área','area'),
      desc:    col(hdr,'descripción del gasto','descripción','descripcion','description'),
      monto:   col(hdr,'monto ($mxn)','monto (mxn)','monto','amount'),
      estado:  col(hdr,'estado','status','estado del gasto'),
      resp:    col(hdr,'responsable','operador','quien registra'),
      email:   col(hdr,'dirección de correo electrónico','email','correo'),
    };
    log(`COL IDX: ${JSON.stringify(CI)}`);

    const allRows = raw.slice(1).map(r => {
      let resp = getVal(r,CI.resp);
      if (!resp && CI.email>=0) {
        const em = String(r[CI.email]||'').toLowerCase();
        if (em.includes('carlos')) resp = 'Carlos';
        else if (em.includes('jethro')||em.includes('jet')) resp = 'Jethro';
      }
      return {
        fecha:   getVal(r,CI.fecha),
        semana:  getVal(r,CI.semana),
        negocio: getVal(r,CI.negocio)||'Sin negocio',
        desc:    getVal(r,CI.desc),
        monto:   parseMXN(r[CI.monto]),
        estado:  getVal(r,CI.estado)||'🟡 Pendiente',
        resp:    resp,
      };
    }).filter(r => r.monto>0||r.fecha);

    // Mis rows
    const myName = currentUser.name.toLowerCase();
    const myRows = allRows.filter(r => r.resp.toLowerCase().includes(myName));
    log(`\nMIS ROWS: ${myRows.length} / ${allRows.length} total`);

    // Semana activa
    const now  = new Date();
    const wNum = isoWeek(now);
    const wDay = now.getDay()||7;
    const wMon = new Date(now); wMon.setDate(now.getDate()-wDay+1); wMon.setHours(0,0,0,0);
    const wSun = new Date(wMon); wSun.setDate(wMon.getDate()+6); wSun.setHours(23,59,59,999);

    const weekRows = myRows.filter(r => {
      if (r.semana) return String(r.semana).trim()===String(wNum);
      const d = parseDate(r.fecha);
      return d && d>=wMon && d<=wSun;
    });
    const prevRows = myRows.filter(r => !weekRows.includes(r)).reverse().slice(0,10);

    log(`SEMANA ROWS: ${weekRows.length}, PREV ROWS: ${prevRows.length}`);

    render(weekRows, prevRows, wNum, wMon, wSun);

    document.getElementById('loading').style.display      = 'none';
    document.getElementById('content-wrap').style.display = 'block';
    document.getElementById('update-bar').textContent = `Actualizado: ${new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}`;

  } catch(err) {
    log(`\n❌ ERROR: ${err.message}`);
    document.getElementById('loading').style.display = 'none';
    showErr(err.message);
  }

  document.getElementById('dbg-body').textContent = dbg.join('\n');
}

/* ========================================
   RENDER
   ======================================== */
function render(weekRows, prevRows, wNum, wMon, wSun) {
  const fmt = d => d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'});

  document.getElementById('sem-num').textContent   = wNum;
  document.getElementById('sem-rango').textContent = `${fmt(wMon)} – ${fmt(wSun)}`;

  const isAprobado = r => /aprobado|🟢/i.test(r.estado);

  const gastado  = weekRows.reduce((s,r)=>s+r.monto,0);
  const aprobado = weekRows.filter(isAprobado).reduce((s,r)=>s+r.monto,0);
  const pendiente= gastado-aprobado;
  const fondo    = currentUser.fondo;
  const dispon   = fondo-gastado;
  const pct      = fondo ? Math.min(100,Math.round(gastado/fondo*100)) : 0;

  // Semáforo
  const sem  = dispon<CFG.SALDO_CRITICO?'🔴':dispon<CFG.SALDO_ALERTA?'🟡':'🟢';
  const lvl  = dispon<CFG.SALDO_CRITICO?'crit':dispon<CFG.SALDO_ALERTA?'warn':'ok';
  const avCl = dispon<0?'c-red':dispon<CFG.SALDO_CRITICO?'c-red':dispon<CFG.SALDO_ALERTA?'c-yellow':'c-green';

  document.getElementById('fondo-card').className    = `fondo-card ${lvl}`;
  document.getElementById('fc-sem').textContent      = sem;
  document.getElementById('fc-available').textContent= fmtMXN(dispon);
  document.getElementById('fc-available').className  = `fc-available ${lvl}`;
  document.getElementById('fc-fondo-total').textContent = fmtMXN(fondo);
  document.getElementById('fc-bar').style.width      = `${pct}%`;
  document.getElementById('fc-bar').style.background = pct>90?'var(--red)':pct>70?'var(--yellow)':'var(--green)';
  document.getElementById('fc-gastado').textContent  = fmtMXN(gastado);
  document.getElementById('fc-aprobado').textContent = fmtMXN(aprobado);
  document.getElementById('fc-pendiente').textContent= fmtMXN(pendiente);

  // Mis gastos semana
  document.getElementById('sem-count').textContent = weekRows.length;
  renderList('gasto-list', weekRows.slice().reverse());

  // Anteriores
  document.getElementById('ant-count').textContent = prevRows.length;
  renderList('ant-list', prevRows);
}

function renderList(id, rows) {
  const el = document.getElementById(id);
  if (!rows.length) {
    el.innerHTML = `<div class="empty">Sin registros</div>`;
    return;
  }
  el.innerHTML = rows.map(r => {
    const estadoIcon = /aprobado|🟢/i.test(r.estado)?'🟢'
      :/revisado|🔵/i.test(r.estado)?'🔵'
      :/observaci|🟠/i.test(r.estado)?'🟠':'🟡';
    const badgeCl = /aprobado|🟢/i.test(r.estado)?'gb-aprobado'
      :/revisado|🔵/i.test(r.estado)?'gb-revisado'
      :/observaci|🟠/i.test(r.estado)?'gb-observacion':'gb-pendiente';
    const estadoTxt = /aprobado|🟢/i.test(r.estado)?'Aprobado'
      :/revisado|🔵/i.test(r.estado)?'Revisado'
      :/observaci|🟠/i.test(r.estado)?'Observación':'Pendiente';
    return `<div class="gasto-item">
      <div class="gi-estado">${estadoIcon}</div>
      <div class="gi-body">
        <div class="gi-neg">${r.negocio}</div>
        <div class="gi-top">
          <div class="gi-desc">${r.desc||'—'}</div>
          <div class="gi-monto">${fmtMXN(r.monto)}</div>
        </div>
        <div class="gi-bottom">
          <div class="gi-fecha">${r.fecha||'—'}</div>
          <span class="gi-badge ${badgeCl}">${estadoTxt}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ========================================
   ERROR
   ======================================== */
function showErr(msg) {
  const is403 = msg.includes('403')||/permission|denied|restricted/i.test(msg);
  let hint = '';
  if (is403) {
    hint = `<div class="err-fix">
      El Sheet puede no estar público. Pide a Silvia que verifique:<br>
      Compartir → Cualquier persona con el enlace → Lector
    </div>`;
  }
  document.getElementById('err-box').innerHTML = `
    <div class="err-box">
      <strong>❌ Sin conexión con el Sheet</strong>
      ${msg}
      ${hint}
    </div>`;
}
</script>
