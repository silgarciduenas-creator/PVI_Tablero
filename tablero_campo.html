<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PVI · Campo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#060e1f; --card:#0d1a35; --card2:#152040; --border:rgba(255,255,255,.07);
      --text:#e8f0ff; --muted:#4a607a; --accent:#ff6b35;
      --green:#22c55e; --yellow:#f59e0b; --red:#ef4444; --blue:#60a5fa;
      --fn:'Bebas Neue',sans-serif; --fb:'Nunito',sans-serif;
      --safe-b:env(safe-area-inset-bottom,0px);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;}
    body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;
         -webkit-tap-highlight-color:transparent;overscroll-behavior:none;}

    /* ── PIN ── */
    #pin-screen{
      position:fixed;inset:0;z-index:9999;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:var(--bg);
      background-image:radial-gradient(ellipse 70% 50% at 50% 30%,rgba(255,107,53,.07) 0%,transparent 70%);
      padding:24px;
    }
    .pin-logo{font-family:var(--fn);font-size:52px;letter-spacing:6px;color:var(--accent);line-height:1;margin-bottom:4px;}
    .pin-sub{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:44px;}
    .pin-dots{display:flex;gap:16px;margin-bottom:36px;}
    .pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--card2);background:transparent;transition:all .15s;}
    .pin-dot.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(255,107,53,.5);}
    .pin-pad{display:grid;grid-template-columns:repeat(3,84px);gap:8px;}
    .pb{height:76px;background:var(--card);border:1px solid var(--border);border-radius:16px;
        color:var(--text);font-family:var(--fn);font-size:28px;cursor:pointer;
        transition:background .1s,border-color .1s,transform .08s;
        display:flex;align-items:center;justify-content:center;}
    .pb:active{background:rgba(255,107,53,.15);border-color:var(--accent);transform:scale(.94);}
    .pb.sm{font-size:16px;font-family:var(--fb);font-weight:600;color:var(--muted);}
    .pin-err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin-top:14px;}

    /* ── APP SHELL ── */
    #app{display:none;height:100%;flex-direction:column;}
    .topbar{
      height:52px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;padding:0 16px;
    }
    .tb-l{display:flex;align-items:center;gap:10px;}
    .tb-logo{font-family:var(--fn);font-size:20px;letter-spacing:3px;color:var(--accent);}
    .tb-chip{background:var(--card2);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--text);}
    .tb-r{display:flex;align-items:center;gap:8px;}
    .tb-sem{font-size:11px;color:var(--muted);text-align:right;line-height:1.3;max-width:120px;}
    .btn-ref{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:6px;transition:color .15s;}
    .btn-ref:active{color:var(--accent);}

    .views{flex:1;overflow:hidden;position:relative;}
    .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
          padding:14px;opacity:0;pointer-events:none;transition:opacity .18s;}
    .view.active{opacity:1;pointer-events:all;}

    .tabs{
      flex-shrink:0;height:calc(58px + var(--safe-b));
      background:var(--card);border-top:1px solid var(--border);
      display:flex;padding-bottom:var(--safe-b);
    }
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
         cursor:pointer;background:none;border:none;color:var(--muted);font-family:var(--fb);
         font-size:11px;font-weight:700;letter-spacing:.3px;transition:color .15s;}
    .tab .ti{font-size:22px;line-height:1;}
    .tab.active{color:var(--accent);}

    /* ── LOADING / ERROR ── */
    .ldg{display:flex;flex-direction:column;align-items:center;justify-content:center;
         padding:60px 20px;gap:12px;color:var(--muted);}
    .spin{font-size:30px;animation:spin 1.1s linear infinite;display:inline-block;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .ldg p{font-size:13px;}
    .err-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);
             border-radius:12px;padding:14px 16px;color:#fca5a5;font-size:13px;
             line-height:1.6;margin-bottom:12px;}
    .err-box strong{display:block;margin-bottom:4px;}

    /* ── HERO CARD ── */
    .hero{border-radius:18px;padding:20px 20px 20px;margin-bottom:12px;
          position:relative;overflow:hidden;}
    .hero::after{content:'';position:absolute;inset:0;border-radius:18px;
                 border:1px solid rgba(255,255,255,.1);pointer-events:none;}
    .hero.ok  {background:linear-gradient(135deg,#082a15 0%,#0d1a35 100%);}
    .hero.warn{background:linear-gradient(135deg,#2a1a04 0%,#0d1a35 100%);}
    .hero.crit{background:linear-gradient(135deg,#2a0808 0%,#0d1a35 100%);}
    .hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px;}
    .hero-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;}
    .hero-sem{font-size:24px;line-height:1;}
    .hero-amt{font-family:var(--fn);font-size:clamp(52px,14vw,70px);line-height:1;letter-spacing:1px;margin:4px 0 2px;}
    .hero-amt.ok  {color:var(--green);}
    .hero-amt.warn{color:var(--yellow);}
    .hero-amt.crit{color:var(--red);}
    .hero-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
    .bar-t{background:rgba(255,255,255,.08);border-radius:4px;height:6px;overflow:hidden;}
    .bar-f{height:100%;border-radius:4px;transition:width .7s ease;}
    .bar-f.ok  {background:var(--green);}
    .bar-f.warn{background:var(--yellow);}
    .bar-f.crit{background:var(--red);}
    .hero-meta{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:14px;gap:0;}
    .hm{text-align:center;}
    .hm:first-child{text-align:left;}
    .hm:last-child{text-align:right;}
    .hm-l{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
    .hm-v{font-family:var(--fn);font-size:20px;letter-spacing:.3px;margin-top:2px;}

    /* ── STATS ROW ── */
    .stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
    .stat-l{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px;}
    .stat-v{font-family:var(--fn);font-size:22px;letter-spacing:.3px;}
    .cg{color:var(--green);} .cy{color:var(--yellow);} .cr{color:var(--red);} .cb{color:var(--blue);}

    /* ── SECTION HEADER ── */
    .sec-h{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px;}
    .sec-t{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
    .sec-b{background:var(--card2);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;color:var(--text);}

    /* ── GASTO CARDS ── */
    .g-list{display:flex;flex-direction:column;gap:8px;padding-bottom:16px;}
    .gc{background:var(--card);border:1px solid var(--border);border-radius:14px;
        padding:12px 14px;display:flex;align-items:flex-start;gap:12px;}
    .gc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;}
    .gc-body{flex:1;min-width:0;}
    .gc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
    .gc-desc{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
    .gc-m{font-family:var(--fn);font-size:18px;flex-shrink:0;letter-spacing:.3px;}
    .gc-bot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
    .gc-neg{font-size:11px;color:var(--muted);}
    .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;}
    .b-p{background:rgba(245,158,11,.12);color:#fde68a;}
    .b-r{background:rgba(96,165,250,.12);color:#93c5fd;}
    .b-o{background:rgba(249,115,22,.12);color:#fed7aa;}
    .b-a{background:rgba(34,197,94,.12);color:#86efac;}

    .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;}
    .empty .ei{font-size:36px;margin-bottom:10px;}

    /* ── ACUMULADO ── */
    .acum-kpis{background:var(--card);border:1px solid var(--border);border-radius:14px;
               padding:16px 14px;margin-bottom:12px;}
    .akpi-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;}
    .akpi{text-align:center;border-right:1px solid var(--border);}
    .akpi:first-child{text-align:left;}
    .akpi:last-child{text-align:right;border-right:none;}
    .akpi-l{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:4px;}
    .akpi-v{font-family:var(--fn);font-size:20px;}

    .filter-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;}
    .filter-row::-webkit-scrollbar{display:none;}
    .fchip{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:20px;
           padding:5px 12px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;
           white-space:nowrap;transition:all .12s;}
    .fchip.on{background:var(--accent);border-color:var(--accent);color:#fff;}

    .neg-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
              padding:2px 14px;margin-bottom:12px;}
    .neg-row{display:flex;justify-content:space-between;align-items:center;
             padding:10px 0;border-bottom:1px solid var(--border);}
    .neg-row:last-child{border-bottom:none;}
    .neg-n{font-size:13px;font-weight:700;}
    .neg-t{font-family:var(--fn);font-size:17px;color:var(--accent);}

    /* ── DEBUG ── */
    .dbg{background:var(--card);border:1px solid var(--border);border-radius:10px;
         font-size:10px;font-family:monospace;margin:0 0 20px;}
    .dbg summary{padding:10px 14px;cursor:pointer;color:var(--muted);}
    .dbg-body{padding:0 14px 14px;color:var(--muted);max-height:200px;overflow-y:auto;
              white-space:pre-wrap;line-height:1.6;}
  </style>
</head>
<body>

<!-- PIN -->
<div id="pin-screen">
  <div class="pin-logo">PVI</div>
  <div class="pin-sub">Tablero de Campo</div>
  <div class="pin-dots" id="dots">
    <div class="pin-dot"></div><div class="pin-dot"></div>
    <div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div class="pin-pad">
    <button type="button" class="pb" onclick="p('1')">1</button>
    <button type="button" class="pb" onclick="p('2')">2</button>
    <button type="button" class="pb" onclick="p('3')">3</button>
    <button type="button" class="pb" onclick="p('4')">4</button>
    <button type="button" class="pb" onclick="p('5')">5</button>
    <button type="button" class="pb" onclick="p('6')">6</button>
    <button type="button" class="pb" onclick="p('7')">7</button>
    <button type="button" class="pb" onclick="p('8')">8</button>
    <button type="button" class="pb" onclick="p('9')">9</button>
    <button type="button" class="pb sm" onclick="pDel()">⌫</button>
    <button type="button" class="pb" onclick="p('0')">0</button>
    <button type="button" class="pb sm" onclick="pClr()">✕</button>
  </div>
  <div class="pin-err" id="pin-err"></div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="tb-l">
      <span class="tb-logo">PVI</span>
      <span class="tb-chip" id="tb-name">—</span>
    </div>
    <div class="tb-r">
      <div class="tb-sem" id="tb-sem">—</div>
      <button type="button" class="btn-ref" onclick="loadData()">↻</button>
    </div>
  </div>

  <div class="views">

    <!-- VIEW 1: Mi Semana -->
    <div class="view active" id="v1">
      <div id="v1-err"></div>
      <div class="ldg" id="v1-ldg"><span class="spin">◌</span><p>Cargando datos…</p></div>
      <div id="v1-c" style="display:none">
        <div class="hero" id="hero">
          <div class="hero-top">
            <div class="hero-lbl">Saldo disponible</div>
            <div class="hero-sem" id="h-sem">—</div>
          </div>
          <div class="hero-amt" id="h-amt">—</div>
          <div class="hero-sub" id="h-sub">—</div>
          <div class="bar-t"><div class="bar-f" id="h-bar" style="width:0%"></div></div>
          <div class="hero-meta">
            <div class="hm"><div class="hm-l">Fondo semana</div><div class="hm-v" id="h-fondo">—</div></div>
            <div class="hm"><div class="hm-l">Gastado</div><div class="hm-v" id="h-gast">—</div></div>
            <div class="hm"><div class="hm-l">Repuesto</div><div class="hm-v" id="h-rep">—</div></div>
          </div>
        </div>
        <div class="stats-row">
          <div class="stat"><div class="stat-l">Aprobado ✓</div><div class="stat-v cg" id="s-aprov">—</div></div>
          <div class="stat"><div class="stat-l">En revisión</div><div class="stat-v cy" id="s-pend">—</div></div>
        </div>
        <div class="sec-h"><span class="sec-t">Mis gastos — semana activa</span><span class="sec-b" id="v1-cnt">0</span></div>
        <div class="g-list" id="v1-list"></div>
      </div>
    </div>

    <!-- VIEW 2: Mi Acumulado -->
    <div class="view" id="v2">
      <div class="acum-kpis">
        <div class="sec-t" style="margin-bottom:12px">Mi acumulado — total año</div>
        <div class="akpi-row">
          <div class="akpi"><div class="akpi-l">Registrado</div><div class="akpi-v" id="a-tot">—</div></div>
          <div class="akpi"><div class="akpi-l">Aprobado</div><div class="akpi-v cg" id="a-apv">—</div></div>
          <div class="akpi"><div class="akpi-l">Pendiente</div><div class="akpi-v cy" id="a-pnd">—</div></div>
        </div>
      </div>
      <div class="filter-row" id="frow">
        <div class="fchip on" onclick="setF('__all__',this)">Todos</div>
      </div>
      <div class="sec-h"><span class="sec-t">Por negocio</span></div>
      <div class="neg-card" id="neg-sum"></div>
      <div class="sec-h"><span class="sec-t">Todos mis registros</span><span class="sec-b" id="v2-cnt">0</span></div>
      <div class="g-list" id="v2-list" style="padding-bottom:20px"></div>
      <details class="dbg"><summary>🔧 Diagnóstico</summary><div class="dbg-body" id="dbg">—</div></details>
    </div>

  </div><!-- /views -->

  <div class="tabs">
    <button type="button" class="tab active" id="t1" onclick="swTab('v1','t1')">
      <span class="ti">📅</span><span>Mi Semana</span>
    </button>
    <button type="button" class="tab" id="t2" onclick="swTab('v2','t2')">
      <span class="ti">📊</span><span>Mi Acumulado</span>
    </button>
  </div>
</div>

<script>
/* ── CONFIG ── */
const CFG = {
  SID: '1CQyRHmA99cfTar5kjvXgVvX9j6RKrTLUEHx-M5JhXyk',
  KEY: 'AIzaSyBL_gicAJD3zZ8Ils_-t42VyDhShPg_brg',
  USERS: {
    '2403': { name:'Carlos', fondo:118380 },
    '1304': { name:'Jethro', fondo:40000  },
  },
  CRIT:5000, ALRT:10000,
};

let USER=null, GASTOS=[], SD={}, NEG='__all__', PIN='', DBG=[];

/* ── PIN ── */
function p(d){
  if(PIN.length>=4)return;
  PIN+=d;
  dots();
  if(PIN.length===4)chk();
}
function pDel(){PIN=PIN.slice(0,-1);dots();}
function pClr(){PIN='';dots();}
function dots(){
  document.querySelectorAll('.pin-dot').forEach((e,i)=>e.classList.toggle('on',i<PIN.length));
}
function chk(){
  if(CFG.USERS[PIN]){
    USER=CFG.USERS[PIN];
    document.getElementById('pin-screen').style.display='none';
    const a=document.getElementById('app');
    a.style.display='flex';a.style.flexDirection='column';
    document.getElementById('tb-name').textContent=USER.name;
    loadData();
  } else {
    document.getElementById('pin-err').textContent='PIN incorrecto';
    setTimeout(()=>{PIN='';dots();document.getElementById('pin-err').textContent='';},1200);
  }
}

/* ── API ── */
async function api(range){
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${CFG.SID}/values/${encodeURIComponent(range)}?key=${CFG.KEY}`;
  DBG.push(`▶ ${range}`);
  const r=await fetch(url);
  DBG.push(`  ${r.status}`);
  if(!r.ok){const b=await r.json().catch(()=>({}));throw new Error(b.error?.message||`HTTP ${r.status}`);}
  const d=await r.json();
  DBG.push(`  ${(d.values||[]).length} rows`);
  return d.values||[];
}

/* ── HELPERS ── */
function $MXN(v){
  if(v===null||v===undefined||v==='')return 0;
  if(typeof v==='number')return v;
  return parseFloat(String(v).replace(/[$\s]/g,'').replace(/\.(?=\d{3}(\.|$))/g,'').replace(',','.'))||0;
}
function fMXN(n){return n||n===0?'$'+Math.round(n).toLocaleString('es-MX'):'—';}
function fFecha(v){
  if(!v)return'—';
  if(typeof v==='string'){
    const m=v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if(m){const d=new Date(+m[3],+m[2]-1,+m[1]);if(!isNaN(d))return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'});}
    const m2=v.match(/^(\d{4})[\/\-](\d{2})[\/\-](\d{2})/);
    if(m2){const d=new Date(+m2[1],+m2[2]-1,+m2[3]);if(!isNaN(d))return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'});}
  }
  if(typeof v==='number'){const d=new Date((v-25569)*86400*1000);if(!isNaN(d))return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'});}
  return String(v);
}
function isoWk(d){
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=dt.getUTCDay()||7;dt.setUTCDate(dt.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil((((dt-y0)/864e5)+1)/7);
}
function wkFromLabel(lbl){
  const MES={ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11};
  const m=String(lbl||'').toLowerCase().match(/^(\d{1,2})\s+([a-zá]+)/);
  if(m){const mn=MES[m[2].substring(0,3)];if(mn!==undefined)return isoWk(new Date(2026,mn,+m[1]));}
  return isoWk(new Date());
}
function wkFromFecha(s){
  if(!s)return 0;
  const m=String(s).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m)return isoWk(new Date(+m[3],+m[2]-1,+m[1]));
  const m2=String(s).match(/^(\d{4})[\/\-](\d{2})[\/\-](\d{2})/);
  if(m2)return isoWk(new Date(+m2[1],+m2[2]-1,+m2[3]));
  return 0;
}
function colMap(hdr){
  // Normalize: lowercase, trim, replace newlines with spaces
  const norm=s=>String(s).toLowerCase().replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim();
  const m={};(hdr||[]).forEach((h,i)=>m[norm(h)]=i);
  const g=(...ks)=>{for(const k of ks)if(m[k]!==undefined)return m[k];return -1;};
  return {
    fecha:g('fecha de compra','fecha compra','fecha','marca temporal'),
    resp: g('responsable','operador','nombre del responsable','quien registra'),
    email:g('dirección de correo electrónico','correo electrónico','correo','email'),
    neg:  g('negocio','empresa','área','area'),
    sub:  g('subcategoría','subcategoria','sub'),
    tipo: g('tipo de gasto','tipo gasto','tipo'),
    desc: g('descripción del gasto. ej: 'cloro granulado 5kg para alberca'',
            'descripción del gasto','descripción','descripcion','description','detalle'),
    prov: g('proveedor / tienda','proveedor / tienda','proveedor','tienda'),
    monto:g('monto ($mxn)','monto (mxn)','monto','importe','amount'),
    sem:  g('semana','semana #','# semana'),
    tardio:g('⏰ tardío','tardío','tardio'),
    estado:g('estado','status','estado del gasto'),
    notas:g('notas ana','notas ана'),
    sla:  g('⏱ sla ana','sla ana','sla'),
  };
}
function toGasto(row,CM){
  const v=(i)=>i>=0?(row[i]||''):'';
  let resp=v(CM.resp).trim();
  if(!resp&&CM.email>=0){
    const em=String(row[CM.email]||'').toLowerCase();
    if(em.includes('carlos'))resp='Carlos';
    else if(em.includes('jethro')||em.includes('jet'))resp='Jethro';
  }
  return {
    fecha:v(CM.fecha),resp,
    neg:v(CM.neg)||'Sin negocio',sub:v(CM.sub),
    desc:v(CM.desc)||v(CM.prov)||'—',
    monto:$MXN(row[CM.monto]),
    wk:parseInt(v(CM.sem))||0,
    tardio:v(CM.tardio),
    estado:v(CM.estado)||'🟡 Pendiente',
    notas:v(CM.notas),
    sla:v(CM.sla),
  };
}

const isAprov=(g)=>/aprobado|🟢/i.test(g.estado);

/* ── LOAD ── */
async function loadData(){
  DBG=[];DBG.push(`PVI Campo — ${USER.name} — ${new Date().toLocaleString('es-MX')}`);
  hide('v1-c');show('v1-ldg');document.getElementById('v1-err').innerHTML='';
  document.getElementById('v1-list').innerHTML='';
  try{
    const[rG,rS]=await Promise.all([api('GASTOS!A4:T500'),api('SEMANA_ACTIVA!E5:H48')]);
    if(rG.length<2)throw new Error('GASTOS vacío o sin acceso público al Sheet.');
    const CM=colMap(rG[0]);DBG.push(`COL MAP: ${JSON.stringify(CM)}`);
    const myN=USER.name.toLowerCase();
    GASTOS=rG.slice(1).map(r=>toGasto(r,CM))
      .filter(g=>g.monto>0&&g.resp&&g.resp.toLowerCase().includes(myN));
    DBG.push(`GASTOS míos: ${GASTOS.length}`);

    // Parse SEMANA_ACTIVA (rows offset from row 5, col 0 = E col)
    const sa=(i)=>(rS[i]&&rS[i][0]!==undefined)?rS[i][0]:'';
    const lbl=sa(0);
    const wn=wkFromLabel(lbl)||isoWk(new Date());
    const carlos=USER.name==='Carlos';
    SD={
      label:lbl, wn:wn,
      fondo:   $MXN(sa(carlos?2:3)),     // E7 / E8
      gastado: $MXN(sa(carlos?8:24)),     // E13 / E29
      pendiente:$MXN(sa(carlos?9:25)),    // E14 / E30
      repuesto: $MXN(sa(carlos?10:26)),   // E15 / E31
      disponible:$MXN(sa(carlos?12:28)),  // E17 / E33
      semaforo:  sa(carlos?13:29),        // E18 / E34
    };
    if(SD.fondo===0)SD.fondo=USER.fondo;
    DBG.push(`SD: ${JSON.stringify(SD)}`);

    render1();render2();
    hide('v1-ldg');show('v1-c');
    document.getElementById('tb-sem').textContent=SD.label||`Sem ${SD.wn}`;
  }catch(e){
    DBG.push(`ERROR: ${e.message}`);
    hide('v1-ldg');
    const is403=e.message.includes('403')||/permission|denied/i.test(e.message);
    document.getElementById('v1-err').innerHTML=`<div class="err-box"><strong>❌ Sin conexión con el Sheet</strong>${e.message}${is403?'<br>Solución: Compartir → Cualquier persona con el enlace → Lector':''}</div>`;
  }
  document.getElementById('dbg').textContent=DBG.join('\n');
}

/* ── RENDER 1: Mi Semana ── */
function render1(){
  const disp=SD.disponible||SD.fondo-SD.gastado+SD.repuesto;
  const pct=SD.fondo>0?Math.min(100,Math.round(SD.gastado/SD.fondo*100)):0;
  // Semáforo: rojo=observación Ana, amarillo=pendiente, verde=ok
  const tieneObs=GASTOS.some(g=>/observaci/i.test(g.estado));
  const tienePend=GASTOS.some(g=>/pendiente/i.test(g.estado));
  const lvl=tieneObs?'crit':tienePend?'warn':'ok';
  const sem=tieneObs?'🔴':tienePend?'🟡':'🟢';

  document.getElementById('hero').className=`hero ${lvl}`;
  document.getElementById('h-sem').textContent=sem;
  const ae=document.getElementById('h-amt');ae.className=`hero-amt ${lvl}`;ae.textContent=fMXN(disp);
  document.getElementById('h-sub').textContent=`de ${fMXN(SD.fondo)} del fondo semanal`;
  const be=document.getElementById('h-bar');be.className=`bar-f ${lvl}`;be.style.width=pct+'%';
  document.getElementById('h-fondo').textContent=fMXN(SD.fondo);
  document.getElementById('h-gast').textContent=fMXN(SD.gastado);
  document.getElementById('h-rep').textContent=fMXN(SD.repuesto);

  // Filter gastos: by semana number OR by week of fecha
  const semG=GASTOS.filter(g=>{
    if(g.wk&&g.wk===SD.wn)return true;
    if(!g.wk)return wkFromFecha(g.fecha)===SD.wn;
    return false;
  });
  const aprov=semG.filter(isAprov).reduce((s,g)=>s+g.monto,0);
  const pend=semG.filter(g=>!isAprov(g)).reduce((s,g)=>s+g.monto,0);
  document.getElementById('s-aprov').textContent=fMXN(aprov);
  document.getElementById('s-pend').textContent=fMXN(pend);
  document.getElementById('v1-cnt').textContent=semG.length;
  renderList('v1-list',semG.slice().reverse());
}

/* ── RENDER 2: Mi Acumulado ── */
function render2(){
  const all=GASTOS;
  const tot=all.reduce((s,g)=>s+g.monto,0);
  const apv=all.filter(isAprov).reduce((s,g)=>s+g.monto,0);
  document.getElementById('a-tot').textContent=fMXN(tot);
  document.getElementById('a-apv').textContent=fMXN(apv);
  document.getElementById('a-pnd').textContent=fMXN(tot-apv);
  document.getElementById('v2-cnt').textContent=all.length;

  // Negocios
  const nm={};all.forEach(g=>nm[g.neg]=(nm[g.neg]||0)+g.monto);
  const ns=Object.entries(nm).sort((a,b)=>b[1]-a[1]);

  // Filters
  const frow=document.getElementById('frow');
  frow.innerHTML='<div class="fchip on" onclick="setF(\'__all__\',this)">Todos</div>';
  ns.forEach(([n])=>{
    const c=document.createElement('div');c.className='fchip';c.textContent=n;
    c.onclick=function(){setF(n,this);};frow.appendChild(c);
  });

  // Neg summary
  document.getElementById('neg-sum').innerHTML=ns.map(([n,t])=>`
    <div class="neg-row"><span class="neg-n">${n}</span><span class="neg-t">${fMXN(t)}</span></div>
  `).join('');

  renderList('v2-list',all.slice().reverse());
}

function setF(neg,el){
  NEG=neg;
  document.querySelectorAll('#frow .fchip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  const filtered=neg==='__all__'?GASTOS:GASTOS.filter(g=>g.neg===neg);
  renderList('v2-list',filtered.slice().reverse());
  document.getElementById('v2-cnt').textContent=filtered.length;
}

/* ── RENDER LIST ── */
function renderList(id,list){
  const el=document.getElementById(id);
  if(!list.length){el.innerHTML='<div class="empty"><div class="ei">📋</div>Sin registros</div>';return;}
  el.innerHTML=list.map(g=>{
    const a=isAprov(g),rv=/revisado|🔵/i.test(g.estado),ob=/observaci|🟠/i.test(g.estado);
    const dc=a?'var(--green)':rv?'var(--blue)':ob?'var(--accent)':'var(--yellow)';
    const bc=a?'b-a':rv?'b-r':ob?'b-o':'b-p';
    const bt=a?'Aprobado':rv?'Revisado':ob?'Observación':'Pendiente';
    return `<div class="gc">
      <div class="gc-dot" style="background:${dc}"></div>
      <div class="gc-body">
        <div class="gc-top">
          <div class="gc-desc">${g.desc}</div>
          <div class="gc-m">${fMXN(g.monto)}</div>
        </div>
        <div class="gc-bot">
          <div class="gc-neg">${g.neg}${g.fecha?' · '+fFecha(g.fecha):''}</div>
          <span class="badge ${bc}">${bt}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ── TABS ── */
function swTab(vid,tid){
  ['v1','v2'].forEach(v=>document.getElementById(v).classList.remove('active'));
  ['t1','t2'].forEach(t=>document.getElementById(t).classList.remove('active'));
  document.getElementById(vid).classList.add('active');
  document.getElementById(tid).classList.add('active');
}

function show(id){const e=document.getElementById(id);if(e)e.style.display='';}
function hide(id){const e=document.getElementById(id);if(e)e.style.display='none';}
</script>
