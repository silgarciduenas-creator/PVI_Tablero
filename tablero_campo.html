<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PVI — Tablero Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f172a; --soft: #64748b; --line: #e2e8f0; --bg: #f0f4f8;
  --orange: #ea580c; --green: #16a34a; --amber: #d97706; --red: #dc2626;
  --blue: #1d4ed8; --purple: #7c3aed; --teal: #0891b2;
  --carlos: #0f172a; --jethro: #6d28d9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }

/* ── PIN ── */
#pin-screen {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  justify-content: center; background: var(--ink); color: #fff;
}
.pin-brand { font-size: 0.72rem; letter-spacing: .2em; text-transform: uppercase; color: #475569; margin-bottom: 1.5rem; }
.pin-title { font-size: 1.9rem; font-weight: 800; margin-bottom: 0.25rem; }
.pin-sub { font-size: 0.85rem; color: #475569; margin-bottom: 2.5rem; }
.pin-dots { display: flex; gap: 1rem; margin-bottom: 2rem; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #334155; transition: all .2s; }
.pin-dot.filled { background: var(--orange); border-color: var(--orange); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 80px); gap: 12px; }
.pkey { height: 80px; border-radius: 16px; border: none; background: #1e293b;
  color: #fff; font-size: 1.6rem; font-weight: 700; cursor: pointer;
  transition: background .15s, transform .1s; font-family: 'Outfit', sans-serif; }
.pkey:hover { background: #334155; }
.pkey:active { transform: scale(.93); background: #475569; }
.pkey.del { background: #dc262618; color: #f87171; }
.pkey.zero { grid-column: 2; }
.pin-err { color: #f87171; font-size: 0.85rem; margin-top: 1rem; height: 1.2rem; text-align: center; }

/* ── DASHBOARD ── */
#dashboard { display: none; }

.top-bar {
  color: #fff; padding: 1rem 1.25rem;
  display: flex; align-items: center; justify-content: space-between;
}
.top-bar.carlos { background: var(--carlos); }
.top-bar.jethro { background: var(--jethro); }
.top-bar h1 { font-size: 1.05rem; font-weight: 700; }
.top-bar p  { font-size: 0.75rem; opacity: .6; margin-top: 2px; }
.refresh-btn { background: rgba(255,255,255,0.12); border: none; color: rgba(255,255,255,.7);
  border-radius: 8px; padding: 0.4rem 0.8rem; font-size: 0.78rem; cursor: pointer; font-family:'Outfit',sans-serif; }

.page { max-width: 500px; margin: 0 auto; padding: 1.1rem; }

/* Main fondo card */
.fondo-card {
  border-radius: 18px; padding: 0; margin-bottom: 1rem;
  overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.08);
}
.fondo-card-head { padding: 1rem 1.1rem; }
.fondo-card-head.carlos { background: var(--carlos); color: #fff; }
.fondo-card-head.jethro { background: var(--jethro); color: #fff; }
.fondo-card-head .label { font-size: 0.72rem; opacity: .6; text-transform: uppercase; letter-spacing: .1em; }
.fondo-card-head .amount { font-size: 2.2rem; font-weight: 800; margin-top: 0.25rem; }
.fondo-card-head .period { font-size: 0.8rem; opacity: .7; margin-top: 0.1rem; }

.fondo-rows { background: #fff; padding: 0.5rem 0; }
.fondo-row { display: flex; justify-content: space-between; align-items: center;
  padding: 0.55rem 1.1rem; border-bottom: 1px solid #f1f5f9; }
.fondo-row:last-child { border-bottom: none; }
.fondo-row .lbl { font-size: 0.85rem; color: var(--soft); }
.fondo-row .val { font-size: 0.9rem; font-weight: 700; }
.fondo-row .val.big { font-size: 1.15rem; }
.fondo-row .val.green { color: var(--green); }
.fondo-row .val.red { color: var(--red); }
.fondo-row .val.amber { color: var(--amber); }
.fondo-row .val.income { color: var(--teal); }
.fondo-row .val.orange { color: var(--orange); }

.semaforo-row { padding: 0.75rem 1.1rem; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; }
.semaforo-row .slbl { font-size: 0.78rem; color: var(--soft); }
.semaforo-row .sval { font-size: 0.88rem; font-weight: 700; }

/* Acumulado */
.acu-card { background: #fff; border-radius: 14px; padding: 1rem 1.1rem;
  margin-bottom: 1rem; border: 1px solid var(--line); }
.acu-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--soft); font-weight: 700; margin-bottom: 0.75rem; }
.acu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.acu-item .al { font-size: 0.72rem; color: #94a3b8; margin-bottom: 2px; }
.acu-item .av { font-size: 1.1rem; font-weight: 700; }

/* Recent gastos */
.recent-card { background: #fff; border-radius: 14px; padding: 1rem 1.1rem;
  margin-bottom: 1rem; border: 1px solid var(--line); }
.recent-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--soft); font-weight: 700; margin-bottom: 0.75rem; }
.g-row { display: flex; justify-content: space-between; align-items: flex-start;
  padding: 0.5rem 0; border-bottom: 1px solid #f8fafc; }
.g-row:last-child { border-bottom: none; }
.g-row .gl { flex: 1; }
.g-row .gd { font-size: 0.85rem; font-weight: 600; }
.g-row .gs { font-size: 0.72rem; color: var(--soft); margin-top: 2px; }
.g-row .gm { font-size: 0.9rem; font-weight: 700; color: var(--orange); }
.estado-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.estado-dot.pendiente { background: #f59e0b; }
.estado-dot.revisado  { background: #0891b2; }
.estado-dot.aprobado  { background: #16a34a; }
.estado-dot.obs       { background: #f97316; }

.form-link { display: flex; align-items: center; justify-content: center; gap: 0.4rem;
  background: var(--orange); color: #fff; border-radius: 12px; padding: 0.9rem;
  text-decoration: none; font-size: 0.9rem; font-weight: 700; margin-top: 0.25rem;
  text-align: center; }

.loading { text-align: center; padding: 2rem; color: var(--soft); }
.error { text-align: center; padding: 2rem; color: var(--red); font-size: .85rem; }
</style>
</head>
<body>

<div id="pin-screen">
  <div class="pin-brand">PVI · Control Operativo 2026</div>
  <div class="pin-title">🏗️ Tablero Campo</div>
  <div class="pin-sub">Carlos · Jethro</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad">
    <button class="pkey" onclick="addPin('1')">1</button>
    <button class="pkey" onclick="addPin('2')">2</button>
    <button class="pkey" onclick="addPin('3')">3</button>
    <button class="pkey" onclick="addPin('4')">4</button>
    <button class="pkey" onclick="addPin('5')">5</button>
    <button class="pkey" onclick="addPin('6')">6</button>
    <button class="pkey" onclick="addPin('7')">7</button>
    <button class="pkey" onclick="addPin('8')">8</button>
    <button class="pkey" onclick="addPin('9')">9</button>
    <button class="pkey del" onclick="delPin()">⌫</button>
    <button class="pkey zero" onclick="addPin('0')">0</button>
  </div>
  <div class="pin-err" id="pin-err"></div>
</div>

<div id="dashboard">
  <div class="top-bar" id="top-bar">
    <div>
      <h1 id="top-nombre">—</h1>
      <p id="top-per">—</p>
    </div>
    <button class="refresh-btn" onclick="loadData()">↻</button>
  </div>
  <div class="page">
    <div class="fondo-card" id="fondo-card">
      <div class="loading">Cargando fondo...</div>
    </div>
    <div class="acu-card" id="acu-card" style="display:none"></div>
    <div class="recent-card" id="recent-card" style="display:none"></div>
    <a class="form-link" id="form-link"
       href="https://docs.google.com/forms/d/e/1FAIpQLSck8k2DphEzjXUCWrirWOhqJa0Top2c_2CC40cfIcKRhWBgRA/viewform"
       target="_blank">➕ Registrar gasto o ingreso</a>
  </div>
</div>

<script>
const KEY = 'AIzaSyBL_gicAJD3zZ8Ils_-t42VyDhShPg_brg';
const SID = '1CQyRHmA99cfTar5kjvXgVvX9j6RKrTLUEHx-M5JhXyk';
const PINS = { '2403': 'Carlos', '1748': 'Jethro' };
let buf = '', userName = '';

function addPin(d) {
  if (buf.length >= 4) return;
  buf += d;
  document.getElementById('d'+(buf.length-1)).classList.add('filled');
  if (buf.length === 4) {
    if (PINS[buf]) {
      userName = PINS[buf];
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadData();
    } else {
      document.getElementById('pin-err').textContent = 'PIN incorrecto';
      setTimeout(() => { buf=''; ['d0','d1','d2','d3'].forEach(i=>document.getElementById(i).classList.remove('filled')); document.getElementById('pin-err').textContent=''; }, 900);
    }
  }
}
function delPin() {
  if (!buf.length) return;
  document.getElementById('d'+(buf.length-1)).classList.remove('filled');
  buf = buf.slice(0,-1);
}

async function batchGet(ranges) {
  const params = ranges.map(r=>`ranges=${encodeURIComponent(r)}`).join('&');
  const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SID}/values:batchGet?${params}&key=${KEY}`);
  const j = await r.json();
  return (j.valueRanges||[]).map(vr=>vr.values?.[0]?.[0]??'0');
}

async function get(range) {
  const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SID}/values/${encodeURIComponent(range)}?key=${KEY}`);
  return (await r.json()).values || [];
}

function mxn(n) {
  const v = parseFloat(String(n||0).replace(/\$/g,'').replace(/\./g,'x').replace(',','.').replace(/x/g,'')) || 0;
  return '$'+v.toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0});
}

function estadoDot(e) {
  if (!e) return '';
  if (e.includes('Pendiente')) return '<span class="estado-dot pendiente"></span>';
  if (e.includes('Revisado'))  return '<span class="estado-dot revisado"></span>';
  if (e.includes('Aprobado'))  return '<span class="estado-dot aprobado"></span>';
  if (e.includes('Observación')) return '<span class="estado-dot obs"></span>';
  return '';
}

async function loadData() {
  const isCarlos = userName === 'Carlos';
  const cls = isCarlos ? 'carlos' : 'jethro';

  // Style top bar
  const tb = document.getElementById('top-bar');
  tb.className = 'top-bar ' + cls;
  document.getElementById('top-nombre').textContent = '👷 ' + userName;

  // Batch fetch: período + fondo data
  const fondoCells = isCarlos
    ? ['SEMANA_ACTIVA!E5','SEMANA_ACTIVA!E7','SEMANA_ACTIVA!E13','SEMANA_ACTIVA!E14','SEMANA_ACTIVA!E15','SEMANA_ACTIVA!E16','SEMANA_ACTIVA!E17','SEMANA_ACTIVA!E18','SEMANA_ACTIVA!E22','SEMANA_ACTIVA!E23','SEMANA_ACTIVA!E24']
    : ['SEMANA_ACTIVA!E5','SEMANA_ACTIVA!E8','SEMANA_ACTIVA!E29','SEMANA_ACTIVA!E30','SEMANA_ACTIVA!E31','SEMANA_ACTIVA!E32','SEMANA_ACTIVA!E33','SEMANA_ACTIVA!E34','SEMANA_ACTIVA!E38','SEMANA_ACTIVA!E39','SEMANA_ACTIVA!E40'];

  const [periodo, fondo, gastado, pendiente, repuesto, ingresos, disponible, semaforo,
         gastAcum, pendAcum, regAcum] = await batchGet(fondoCells);

  document.getElementById('top-per').textContent = 'Semana: ' + periodo;

  // Semáforo color class
  let dispCls = 'green';
  if (semaforo.includes('CRÍTICO')||semaforo.includes('🔴')) dispCls='red';
  else if (semaforo.includes('ALERTA')||semaforo.includes('🟡')) dispCls='amber';

  // Fondo card
  document.getElementById('fondo-card').innerHTML = `
    <div class="fondo-card-head ${cls}">
      <div class="label">Fondo semanal</div>
      <div class="amount">${mxn(fondo)}</div>
      <div class="period">${periodo}</div>
    </div>
    <div class="fondo-rows">
      <div class="fondo-row"><span class="lbl">Gastado (aprobado)</span><span class="val orange">${mxn(gastado)}</span></div>
      <div class="fondo-row"><span class="lbl">Pendiente de aprobar</span><span class="val">${mxn(pendiente)}</span></div>
      <div class="fondo-row"><span class="lbl">Repuesto por Laura</span><span class="val green">+${mxn(repuesto)}</span></div>
      <div class="fondo-row"><span class="lbl">💵 Ingresos al fondo</span><span class="val income">+${mxn(ingresos)}</span></div>
      <div class="fondo-row"><span class="lbl" style="font-weight:600">Disponible real</span><span class="val big ${dispCls}">${mxn(disponible)}</span></div>
    </div>
    <div class="semaforo-row">
      <span class="slbl">Semáforo</span>
      <span class="sval">${semaforo}</span>
    </div>`;

  // Acumulado
  const acuEl = document.getElementById('acu-card');
  acuEl.style.display = 'block';
  acuEl.innerHTML = `
    <div class="acu-title">Acumulado al cierre de semana</div>
    <div class="acu-grid">
      <div class="acu-item"><div class="al">Total gastado aprobado</div><div class="av">${mxn(gastAcum)}</div></div>
      <div class="acu-item"><div class="al">Total pendiente</div><div class="av">${mxn(pendAcum)}</div></div>
      <div class="acu-item"><div class="al">Total registrado</div><div class="av">${mxn(regAcum)}</div></div>
    </div>`;

  // Recent gastos
  try {
    const rows = await get('GASTOS!A6:T60');
    const mine = rows.filter(r => (r[3]||'').toLowerCase() === userName.toLowerCase() && parseFloat(r[9]||0)>0);
    mine.sort((a,b) => new Date(b[0]||0)-new Date(a[0]||0));
    const recent = mine.slice(0,6);

    const recEl = document.getElementById('recent-card');
    recEl.style.display = 'block';
    if (!recent.length) {
      recEl.innerHTML = `<div class="recent-title">Últimos gastos</div><div style="color:var(--soft);font-size:.85rem">Sin gastos registrados aún</div>`;
    } else {
      recEl.innerHTML = `<div class="recent-title">Últimos ${recent.length} gastos</div>` +
        recent.map(r => `
          <div class="g-row">
            <div class="gl">
              <div class="gd">${r[7]||r[4]||'—'}</div>
              <div class="gs">${estadoDot(r[16])}${r[4]||''} · ${r[2]||''}</div>
            </div>
            <div class="gm">${mxn(r[9])}</div>
          </div>`).join('');
    }
  } catch(e) {}
}
</script>
</body>
</html>
